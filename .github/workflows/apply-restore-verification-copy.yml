name: Apply restore verification and copy

on:
  push:
    branches:
      - fix/restore-state-verification-copy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-state-verification-copy
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          settings = Path('app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsScreen.kt')
          text = settings.read_text()

          old = 'import kotlinx.coroutines.launch\n'
          new = 'import kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch\n'
          if old not in text:
              raise SystemExit('coroutine import marker not found')
          text = text.replace(old, new, 1)

          marker = '    fun checkForAppUpdate() {\n'
          helper = (
              '    suspend fun waitForCscState(expectedMuted: Boolean): Boolean {\n'
              '        repeat(20) { attempt ->\n'
              '            if (CscMuteManager.isCscShutterSoundMuted(context) == expectedMuted) return true\n'
              '            if (attempt < 19) delay(100)\n'
              '        }\n'
              '        return false\n'
              '    }\n\n'
          )
          if marker not in text:
              raise SystemExit('checkForAppUpdate marker not found')
          text = text.replace(marker, helper + marker, 1)

          old = '                                    val result = StandaloneAdbManager.getInstance(context).setCameraMute(true)\n                                    if (result.isSuccess && CscMuteManager.isCscShutterSoundMuted(context)) {\n'
          new = '                                    val result = StandaloneAdbManager.getInstance(context).setCameraMute(true)\n                                    val stateApplied = result.isSuccess && waitForCscState(true)\n                                    if (stateApplied) {\n'
          if old not in text:
              raise SystemExit('reapply verification marker not found')
          text = text.replace(old, new, 1)

          old = '                                val result = StandaloneAdbManager.getInstance(context).setCameraMute(false)\n                                if (result.isSuccess && !CscMuteManager.isCscShutterSoundMuted(context)) {\n'
          new = '                                val result = StandaloneAdbManager.getInstance(context).setCameraMute(false)\n                                val stateRestored = result.isSuccess && waitForCscState(false)\n                                if (stateRestored) {\n'
          if old not in text:
              raise SystemExit('restore verification marker not found')
          text = text.replace(old, new, 1)
          settings.write_text(text)

          for filename in [
              'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt',
              'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/notification/PairingNotificationHelper.kt',
          ]:
              path = Path(filename)
              current = path.read_text()
              old = '이제 앱을 계속 열어둘 필요가 없습니다'
              if old not in current:
                  raise SystemExit(f'copy marker not found in {filename}')
              path.write_text(current.replace(old, '앱을 계속 열어둘 필요가 없습니다'))

          Path('.github/workflows/apply-restore-verification-copy.yml').unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsScreen.kt \
                  app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt \
                  app/src/main/java/com/charmingcolor/shuttersoundzero/ui/notification/PairingNotificationHelper.kt \
                  .github/workflows/apply-restore-verification-copy.yml
          git commit -m 'fix: 셔터음 복원 상태 확인 안정화'
          git push origin HEAD:fix/restore-state-verification-copy
