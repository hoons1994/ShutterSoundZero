name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Temporary write access is restricted by the branch guard below and will be removed
# after the public verification keyring is committed to this PR branch.
permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify dependency checksum baseline exists
        shell: bash
        run: test -s gradle/verification-metadata.xml

      - name: Bootstrap pinned public verification keyring
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependency-signature-hardening'
        shell: bash
        run: |
          KEYRING_URL='https://raw.githubusercontent.com/androidx/androidx/fb36344c55b5c811a64f5957153baddbe150fa04/gradle/verification-keyring.keys'
          EXPECTED_GIT_BLOB='276a49621a95cb9e55d4b26521751d0851bdfbff'

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "$KEYRING_URL" \
            --output gradle/verification-keyring.keys

          test -s gradle/verification-keyring.keys
          ACTUAL_GIT_BLOB="$(git hash-object gradle/verification-keyring.keys)"
          if [[ "$ACTUAL_GIT_BLOB" != "$EXPECTED_GIT_BLOB" ]]; then
            echo "Pinned AndroidX keyring blob mismatch: $ACTUAL_GIT_BLOB"
            exit 1
          fi

          grep -oE 'trusted-key id="[A-Fa-f0-9]+"' gradle/verification-metadata.xml \
            | sed -E 's/.*"([A-Fa-f0-9]+)"/\1/' \
            | tr '[:lower:]' '[:upper:]' \
            | sort -u > "$RUNNER_TEMP/trusted-keys.txt"

          gpg --batch --show-keys --with-colons gradle/verification-keyring.keys \
            | awk -F: '$1 == "fpr" { print toupper($10) }' \
            | sort -u > "$RUNNER_TEMP/keyring-fingerprints.txt"

          comm -23 "$RUNNER_TEMP/trusted-keys.txt" "$RUNNER_TEMP/keyring-fingerprints.txt" \
            > "$RUNNER_TEMP/missing-trusted-keys.txt"

          if [[ -s "$RUNNER_TEMP/missing-trusted-keys.txt" ]]; then
            echo 'Pinned AndroidX keyring does not contain every trusted key:'
            cat "$RUNNER_TEMP/missing-trusted-keys.txt"
            exit 1
          fi

          echo "Verified $(wc -l < "$RUNNER_TEMP/trusted-keys.txt") trusted keys against the pinned AndroidX keyring."

      - name: Commit public verification keyring to hardening branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependency-signature-hardening'
        shell: bash
        run: |
          cp gradle/verification-keyring.keys "$RUNNER_TEMP/verification-keyring.keys"

          git fetch --depth=1 origin "${{ github.head_ref }}:refs/remotes/origin/${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "refs/remotes/origin/${{ github.head_ref }}"
          cp "$RUNNER_TEMP/verification-keyring.keys" gradle/verification-keyring.keys

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-keyring.keys
          if git diff --cached --quiet; then
            echo 'Dependency verification keyring is already up to date.'
            exit 0
          fi
          git commit -m 'chore: Gradle PGP 공개키 keyring 고정'
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify complete launcher icon resources
        shell: bash
        run: bash .github/scripts/verify-launcher-icon.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager --channel=0 emulator 'system-images;android-35;default;x86_64'

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Configure AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd"

      - name: Create Android emulator
        shell: bash
        run: |
          echo no | avdmanager create avd \
            --force \
            --name shuttersoundzero-ci \
            --package 'system-images;android-35;default;x86_64' \
            --device pixel

          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          echo 'Available AVDs:'
          "$EMULATOR" -list-avds
          "$EMULATOR" -list-avds | grep -Fxq 'shuttersoundzero-ci'

      - name: Start Android emulator
        shell: bash
        run: |
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          if [[ ! -x "$EMULATOR" ]]; then
            echo "Android emulator executable was not found at $EMULATOR"
            ls -la "$ANDROID_SDK_ROOT/emulator" || true
            exit 1
          fi

          nohup "$EMULATOR" -avd shuttersoundzero-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"

      - name: Wait for emulator boot
        shell: bash
        run: |
          EMULATOR_PID="$(cat "$RUNNER_TEMP/emulator.pid")"

          for _ in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android emulator process exited before boot completed.'
              cat "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then
              BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == "1" ]]; then
                adb shell input keyevent 82 || true
                adb shell settings put global window_animation_scale 0
                adb shell settings put global transition_animation_scale 0
                adb shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo 'Android emulator did not finish booting within 4 minutes.'
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator.log" || true
          exit 1

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-androidTest-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
