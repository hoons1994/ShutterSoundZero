name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIOR_SHA: ${{ github.event.before }}
        run: bash .github/scripts/detect-code-changes.sh

  build:
    name: JVM, Lint & APK Build
    needs: changes
    if: always() && (needs.changes.result == 'failure' || needs.changes.outputs.code_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          ACTIONLINT_VERSION='1.7.12'
          ACTIONLINT_SHA256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"

          curl --fail --silent --show-error --location             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             --output "$ARCHIVE"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Validate repository shell scripts
        shell: bash
        run: shellcheck .github/scripts/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -Fq 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -Fq 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -Eq 'platforms;android-37([[:space:]]|$)' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify dependency checksum baseline exists
        shell: bash
        run: test -s gradle/verification-metadata.xml

      - name: Verify complete launcher icon resources
        shell: bash
        run: bash .github/scripts/verify-launcher-icon.sh

      - name: Create temporary CI release keystore
        shell: bash
        run: |
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/ci-release.jks"             -storepass android             -keypass android             -alias ci-release             -keyalg RSA             -keysize 2048             -validity 3650             -dname 'CN=ShutterSoundZero CI,O=ShutterSoundZero,C=KR'

      - name: Build debug and release APKs, run unit tests and lint
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/ci-release.jks
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: ci-release
          RELEASE_KEY_PASSWORD: android
        run: >-
          ./gradlew
          assembleDebug
          assembleRelease
          testDebugUnitTest
          lintDebug
          --no-daemon
          --stacktrace

      - name: Remove temporary CI release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ci-release.jks"

      - name: Verify release APK was produced
        shell: bash
        run: test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  instrumented:
    name: Android ${{ matrix.android }} (API ${{ matrix.api }}) Instrumented Tests
    needs: changes
    if: always() && (needs.changes.result == 'failure' || needs.changes.outputs.code_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: '11'
            api: 30
          - android: '12'
            api: 31
          - android: '12L'
            api: 32
          - android: '13'
            api: 33
          - android: '14'
            api: 34
          - android: '15'
            api: 35
          - android: '16'
            api: 36
          - android: '17'
            api: 37

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Resolve and install SDK and emulator image
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -Fq 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -Fq 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -Eq 'platforms;android-37([[:space:]]|$)' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 compile SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          if [ "$TEST_API" -eq 37 ]; then
            candidates=(
              'system-images;android-37.0;google_apis;x86_64'
              'system-images;android-CinnamonBun;google_apis;x86_64'
              'system-images;android-37;google_apis;x86_64'
              'system-images;android-37.0;google_apis_playstore;x86_64'
            )
          else
            candidates=(
              "system-images;android-${TEST_API};google_apis;x86_64"
              "system-images;android-${TEST_API};default;x86_64"
            )
          fi

          IMAGE_PACKAGE=''
          for candidate in "${candidates[@]}"; do
            if grep -Fq "$candidate" sdk-packages.txt; then
              IMAGE_PACKAGE="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE_PACKAGE" ]; then
            echo "Android API ${TEST_API} x86_64 system image was not found."
            grep -E "system-images;android-(${TEST_API}|CinnamonBun|37)" sdk-packages.txt || true
            exit 1
          fi

          echo "Installing compile SDK $PLATFORM_PACKAGE and emulator $IMAGE_PACKAGE"
          sdkmanager --channel=3             "$PLATFORM_PACKAGE"             'build-tools;37.0.0'             platform-tools             emulator             "$IMAGE_PACKAGE"

          echo "ANDROID_TEST_IMAGE_PACKAGE=$IMAGE_PACKAGE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Configure AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd"

      - name: Create emulator
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          echo no | avdmanager create avd             --force             --name "shuttersoundzero-api${TEST_API}"             --package "$ANDROID_TEST_IMAGE_PACKAGE"             --device pixel

      - name: Start emulator
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          if [[ ! -x "$EMULATOR" ]]; then
            echo "Android emulator executable was not found at $EMULATOR"
            exit 1
          fi

          nohup "$EMULATOR" -avd "shuttersoundzero-api${TEST_API}"             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             > "$RUNNER_TEMP/emulator-api${TEST_API}.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"

      - name: Wait for emulator boot
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          EMULATOR_PID="$(cat "$RUNNER_TEMP/emulator.pid")"

          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android API ${TEST_API} emulator exited before boot completed."
              cat "$RUNNER_TEMP/emulator-api${TEST_API}.log" || true
              exit 1
            fi

            SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
            if [ -n "$SERIAL" ]; then
              BOOT_COMPLETED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == "1" ]]; then
                ACTUAL_API="$(adb -s "$SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
                if [ "$ACTUAL_API" -ne "$TEST_API" ]; then
                  echo "Expected API ${TEST_API}, got API ${ACTUAL_API}."
                  exit 1
                fi
                adb -s "$SERIAL" shell input keyevent 82 || true
                adb -s "$SERIAL" shell settings put global window_animation_scale 0
                adb -s "$SERIAL" shell settings put global transition_animation_scale 0
                adb -s "$SERIAL" shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Android API ${TEST_API} emulator did not finish booting within 5 minutes."
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator-api${TEST_API}.log" || true
          exit 1

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
          if [ -n "$SERIAL" ]; then
            adb -s "$SERIAL" emu kill || true
          fi
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-androidTest-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator-api${{ matrix.api }}.log
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Build, Test & Lint
    needs:
      - changes
      - build
      - instrumented
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required Android CI checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          BUILD_RESULT: ${{ needs.build.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented.result }}
        run: |
          if [ "$CHANGES_RESULT" = 'success' ] && [ "$CODE_CHANGED" != 'true' ]; then
            echo 'No application, build, dependency, or CI changes require Android validation.'
            exit 0
          fi

          if [ "$BUILD_RESULT" != 'success' ]; then
            echo "::error::JVM, lint, APK build, or CI configuration validation failed: $BUILD_RESULT"
            exit 1
          fi

          if [ "$INSTRUMENTED_RESULT" != 'success' ]; then
            echo "::error::Android API 30-37 compatibility matrix failed: $INSTRUMENTED_RESULT"
            exit 1
          fi

          echo 'Android build, unit tests, lint, release variant, CI validation, and API 30-37 instrumented tests passed.'
