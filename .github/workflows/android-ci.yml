name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIOR_SHA: ${{ github.event.before }}
        run: bash .github/scripts/detect-code-changes.sh

  verify:
    name: Build, Test & Lint
    needs: changes
    if: always() && (needs.changes.result == 'failure' || needs.changes.outputs.code_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify dependency checksum baseline exists
        shell: bash
        run: test -s gradle/verification-metadata.xml

      - name: Verify complete launcher icon resources
        shell: bash
        run: bash .github/scripts/verify-launcher-icon.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Install Android 15 emulator image
        shell: bash
        run: |
          sdkmanager --channel=0 emulator 'system-images;android-35;default;x86_64'

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Configure AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd"

      - name: Create Android 15 emulator
        shell: bash
        run: |
          echo no | avdmanager create avd \
            --force \
            --name shuttersoundzero-ci \
            --package 'system-images;android-35;default;x86_64' \
            --device pixel

          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          echo 'Available AVDs:'
          "$EMULATOR" -list-avds
          "$EMULATOR" -list-avds | grep -Fxq 'shuttersoundzero-ci'

      - name: Start Android 15 emulator
        shell: bash
        run: |
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          if [[ ! -x "$EMULATOR" ]]; then
            echo "Android emulator executable was not found at $EMULATOR"
            ls -la "$ANDROID_SDK_ROOT/emulator" || true
            exit 1
          fi

          nohup "$EMULATOR" -avd shuttersoundzero-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator-api35.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator-api35.pid"

      - name: Wait for Android 15 emulator boot
        shell: bash
        run: |
          EMULATOR_PID="$(cat "$RUNNER_TEMP/emulator-api35.pid")"

          for _ in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android 15 emulator process exited before boot completed.'
              cat "$RUNNER_TEMP/emulator-api35.log" || true
              exit 1
            fi

            SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
            if [ -n "$SERIAL" ]; then
              BOOT_COMPLETED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == "1" ]]; then
                adb -s "$SERIAL" shell input keyevent 82 || true
                adb -s "$SERIAL" shell settings put global window_animation_scale 0
                adb -s "$SERIAL" shell settings put global transition_animation_scale 0
                adb -s "$SERIAL" shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo 'Android 15 emulator did not finish booting within 4 minutes.'
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator-api35.log" || true
          exit 1

      - name: Run Android 15 instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Stop Android 15 emulator
        if: always()
        shell: bash
        run: |
          SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
          if [ -n "$SERIAL" ]; then
            adb -s "$SERIAL" emu kill || true
          fi
          if [ -f "$RUNNER_TEMP/emulator-api35.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator-api35.pid")" 2>/dev/null || true
          fi
          for _ in $(seq 1 30); do
            if ! adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+(device|offline)$'; then
              exit 0
            fi
            sleep 1
          done
          adb devices -l || true

      - name: Resolve and install Android 17 emulator image
        shell: bash
        run: |
          for candidate in \
            'system-images;android-37.0;google_apis;x86_64' \
            'system-images;android-CinnamonBun;google_apis;x86_64' \
            'system-images;android-37;google_apis;x86_64' \
            'system-images;android-37.0;google_apis_playstore;x86_64'; do
            if grep -Fq "$candidate" sdk-packages.txt; then
              IMAGE_PACKAGE="$candidate"
              break
            fi
          done

          if [ -z "${IMAGE_PACKAGE:-}" ]; then
            echo 'Android 17 x86_64 system image was not found.'
            grep -E 'system-images;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $IMAGE_PACKAGE"
          sdkmanager --channel=3 emulator "$IMAGE_PACKAGE"
          echo "ANDROID17_IMAGE_PACKAGE=$IMAGE_PACKAGE" >> "$GITHUB_ENV"

      - name: Create Android 17 emulator
        shell: bash
        run: |
          echo no | avdmanager create avd \
            --force \
            --name shuttersoundzero-api37 \
            --package "$ANDROID17_IMAGE_PACKAGE" \
            --device pixel

      - name: Start Android 17 emulator
        shell: bash
        run: |
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$EMULATOR" -avd shuttersoundzero-api37 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator-api37.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator-api37.pid"

      - name: Wait for Android 17 emulator boot
        shell: bash
        run: |
          EMULATOR_PID="$(cat "$RUNNER_TEMP/emulator-api37.pid")"

          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android 17 emulator process exited before boot completed.'
              cat "$RUNNER_TEMP/emulator-api37.log" || true
              exit 1
            fi

            SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
            if [ -n "$SERIAL" ]; then
              BOOT_COMPLETED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == "1" ]]; then
                SDK_LEVEL="$(adb -s "$SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
                if [ "$SDK_LEVEL" -lt 37 ]; then
                  echo "Expected API 37+, got API $SDK_LEVEL."
                  exit 1
                fi
                adb -s "$SERIAL" shell input keyevent 82 || true
                adb -s "$SERIAL" shell settings put global window_animation_scale 0
                adb -s "$SERIAL" shell settings put global transition_animation_scale 0
                adb -s "$SERIAL" shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo 'Android 17 emulator did not finish booting within 5 minutes.'
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator-api37.log" || true
          exit 1

      - name: Run Android 17 fresh-install local-network E2E
        run: >-
          ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
          -Pandroid.testInstrumentationRunnerArguments.class=io.github.hoons1994.shuttersoundzero.core.adb.LocalNetworkAccessInstrumentedTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-androidTest-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator-api35.log
            ${{ runner.temp }}/emulator-api37.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
