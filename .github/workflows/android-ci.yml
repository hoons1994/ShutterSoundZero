name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
