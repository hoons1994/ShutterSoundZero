name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIOR_SHA: ${{ github.event.before }}
        run: bash .github/scripts/detect-code-changes.sh

  jvm-build-lint:
    name: JVM, Build & Lint
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify dependency verification metadata
        shell: bash
        run: test -s gradle/verification-metadata.xml

      - name: Verify official Gradle wrapper checksum
        run: bash .github/scripts/verify-gradle-wrapper.sh

      - name: Verify launcher icon resources
        shell: bash
        run: bash .github/scripts/verify-launcher-icon.sh

      - name: Download and verify actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Check repository shell scripts
        shell: bash
        run: shellcheck .github/scripts/*.sh

      - name: Create temporary test release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/shuttersoundzero-ci-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"

          keytool -genkeypair \
            -noprompt \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=ShutterSoundZero CI Test'

          {
            printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' 'ci-release'
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug and release APKs, run unit tests and Android Lint
        run: |
          set -euo pipefail
          node --test .github/scripts/verify-release-ci.test.mjs
          ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --no-daemon --stacktrace
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$RELEASE_APK" || ! -s "$RELEASE_APK" ]]; then
            echo 'A non-empty release APK was not produced.'
            exit 1
          fi
          echo "Verified release APK: $RELEASE_APK"

      - name: Remove temporary test release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/shuttersoundzero-ci-release.jks"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-release-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android-instrumented-tests:
    name: ${{ matrix.android-version }} / API ${{ matrix.api }} instrumented tests
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            android-version: Android 11
          - api: 31
            android-version: Android 12
          - api: 32
            android-version: Android 12L
          - api: 33
            android-version: Android 13
          - api: 34
            android-version: Android 14
          - api: 35
            android-version: Android 15
          - api: 36
            android-version: Android 16
          - api: 37
            android-version: Android 17
    env:
      API_LEVEL: ${{ matrix.api }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android 17 compile SDK and API-specific emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-packages.txt"

          if grep -q 'platforms;android-CinnamonBun' "$RUNNER_TEMP/sdk-packages.txt"; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' "$RUNNER_TEMP/sdk-packages.txt"; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' "$RUNNER_TEMP/sdk-packages.txt"; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' "$RUNNER_TEMP/sdk-packages.txt" || true
            exit 1
          fi

          if [[ "$API_LEVEL" == '37' ]]; then
            IMAGE_PACKAGE=''
            for candidate in \
              'system-images;android-37.0;google_apis;x86_64' \
              'system-images;android-CinnamonBun;google_apis;x86_64' \
              'system-images;android-37;google_apis;x86_64' \
              'system-images;android-37.0;google_apis_playstore;x86_64' \
              'system-images;android-CinnamonBun;google_apis_playstore;x86_64' \
              'system-images;android-37;google_apis_playstore;x86_64'; do
              if grep -Fq "$candidate" "$RUNNER_TEMP/sdk-packages.txt"; then
                IMAGE_PACKAGE="$candidate"
                break
              fi
            done
            if [[ -z "$IMAGE_PACKAGE" ]]; then
              echo 'Android 17 x86_64 Google APIs emulator image was not found.'
              grep -E 'system-images;android-(CinnamonBun|37)' "$RUNNER_TEMP/sdk-packages.txt" || true
              exit 1
            fi
          else
            IMAGE_PACKAGE="system-images;android-$API_LEVEL;google_apis;x86_64"
          fi

          echo "Installing $PLATFORM_PACKAGE and $IMAGE_PACKAGE"
          sdkmanager --channel=3 \
            "$PLATFORM_PACKAGE" \
            'build-tools;37.0.0' \
            platform-tools \
            emulator \
            "$IMAGE_PACKAGE"
          echo "ANDROID_IMAGE_PACKAGE=$IMAGE_PACKAGE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Configure AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd"

      - name: Create fresh API-specific emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd \
            --force \
            --name "shuttersoundzero-api-$API_LEVEL" \
            --package "$ANDROID_IMAGE_PACKAGE" \
            --device pixel

          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          echo 'Available AVDs:'
          "$EMULATOR" -list-avds
          "$EMULATOR" -list-avds | grep -Fxq "shuttersoundzero-api-$API_LEVEL"

      - name: Start emulator
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$EMULATOR" -avd "shuttersoundzero-api-$API_LEVEL" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator-api-$API_LEVEL.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator-api-$API_LEVEL.pid"

      - name: Wait for emulator boot
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR_PID="$(cat "$RUNNER_TEMP/emulator-api-$API_LEVEL.pid")"

          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "API $API_LEVEL emulator process exited before boot completed."
              cat "$RUNNER_TEMP/emulator-api-$API_LEVEL.log" || true
              exit 1
            fi

            SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
            if [[ -n "$SERIAL" ]]; then
              BOOT_COMPLETED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == '1' ]]; then
                SDK_LEVEL="$(adb -s "$SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
                if [[ "$SDK_LEVEL" != "$API_LEVEL" ]]; then
                  echo "Expected API $API_LEVEL, got API $SDK_LEVEL."
                  exit 1
                fi
                adb -s "$SERIAL" shell input keyevent 82 || true
                adb -s "$SERIAL" shell settings put global window_animation_scale 0
                adb -s "$SERIAL" shell settings put global transition_animation_scale 0
                adb -s "$SERIAL" shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo "API $API_LEVEL emulator did not finish booting within 5 minutes."
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator-api-$API_LEVEL.log" || true
          exit 1

      - name: Run the full instrumented test suite
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Collect emulator logs and stop emulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v adb >/dev/null 2>&1; then
            SERIAL="$(adb devices | awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')"
            if [[ -n "$SERIAL" ]]; then
              adb -s "$SERIAL" logcat -d > "$RUNNER_TEMP/logcat-api-$API_LEVEL.log" || true
              adb -s "$SERIAL" emu kill || true
            fi
          fi
          if [[ -f "$RUNNER_TEMP/emulator-api-$API_LEVEL.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/emulator-api-$API_LEVEL.pid")" 2>/dev/null || true
          fi

      - name: Upload API ${{ matrix.api }} test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-androidTest-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator-api-${{ matrix.api }}.log
            ${{ runner.temp }}/logcat-api-${{ matrix.api }}.log
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Build, Test & Lint
    needs:
      - changes
      - jvm-build-lint
      - android-instrumented-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful classification and code checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          JVM_RESULT: ${{ needs.jvm-build-lint.result }}
          ANDROID_MATRIX_RESULT: ${{ needs.android-instrumented-tests.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != 'success' ]]; then
            echo "Code change classification did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          case "$CODE_CHANGED" in
            true)
              if [[ "$JVM_RESULT" != 'success' ]]; then
                echo "JVM/build/lint job did not succeed: $JVM_RESULT"
                exit 1
              fi
              if [[ "$ANDROID_MATRIX_RESULT" != 'success' ]]; then
                echo "Android API matrix did not succeed: $ANDROID_MATRIX_RESULT"
                exit 1
              fi
              ;;
            false)
              echo 'Documentation-only change; Android checks were intentionally skipped.'
              ;;
            *)
              echo "Unexpected code_changed output: $CODE_CHANGED"
              exit 1
              ;;
          esac
