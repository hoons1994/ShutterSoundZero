name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/audit-hardening-followup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-verification:
    name: Bootstrap dependency verification
    if: ${{ github.event_name == 'push' && github.ref_name == 'chore/audit-hardening-followup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Skip existing baseline
        id: baseline
        shell: bash
        run: |
          if [[ -f gradle/verification-metadata.xml ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate SHA-256 verification metadata
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 \
            assembleDebug \
            testDebugUnitTest \
            lintDebug \
            assembleDebugAndroidTest \
            --no-daemon \
            --stacktrace
          test -s gradle/verification-metadata.xml

      - name: Commit verification metadata
        if: ${{ steps.baseline.outputs.exists == 'false' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: lock Gradle dependency checksums'
          git push origin HEAD:"${GITHUB_REF_NAME}"

  verify:
    name: Build, Test, Lint & Instrumentation
    if: ${{ github.event_name != 'push' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify complete launcher icon resources
        shell: bash
        run: bash .github/scripts/verify-launcher-icon.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager --channel=0 emulator 'system-images;android-35;default;x86_64'

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create Android emulator
        shell: bash
        run: |
          echo no | avdmanager create avd \
            --force \
            --name shuttersoundzero-ci \
            --package 'system-images;android-35;default;x86_64' \
            --device pixel

      - name: Start Android emulator
        shell: bash
        run: |
          nohup emulator @shuttersoundzero-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Wait for emulator boot
        shell: bash
        run: |
          adb wait-for-device
          for _ in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb shell input keyevent 82 || true
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done

          echo 'Android emulator did not finish booting.'
          cat "$RUNNER_TEMP/emulator.log" || true
          exit 1

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-androidTest-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShutterSoundZero-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
