name: v1.4.3 README 최종 정리

on:
  push:
    branches:
      - release/v1.4.3-semi-auto-update
    paths:
      - '.github/workflows/v143-readme-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v1.4.3-semi-auto-update
      - name: README 정리
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Version-1.4.2-orange.svg', 'Version-1.4.3-orange.svg')
          old = '* **명시적 업데이트 통신**: GitHub Releases 네트워크 연결은 사용자가 [앱 업데이트]를 눌렀을 때만 발생하며 자동·주기적 업데이트 확인은 하지 않습니다.'
          new = '* **최소 업데이트 통신**: 자동 확인이 켜져 있으면 앱을 열거나 다시 활성화할 때 24시간에 한 번 이하로 최신 정식 Release 메타데이터만 확인합니다. APK 다운로드는 사용자가 [업데이트]를 누른 뒤에만 시작하며, 자동 확인은 설정에서 끌 수 있습니다.'
          if old not in text:
              raise SystemExit('stale update communication text not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: 임시 워크플로 제거 및 커밋
        shell: bash
        run: |
          rm .github/workflows/v143-readme-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/v143-readme-finalize.yml
          git commit -m 'docs: v1.4.3 반자동 업데이트 안내 정합성 보완'
          git push origin HEAD:release/v1.4.3-semi-auto-update
