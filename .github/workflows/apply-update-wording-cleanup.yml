name: Apply update wording cleanup

on:
  push:
    branches:
      - fix/first-run-shutter-sound-wording

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/first-run-shutter-sound-wording
          fetch-depth: 0

      - name: Apply wording changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt': [
                  (
                      'title = "재부팅·소프트웨어 업데이트 후",',
                      'title = "소프트웨어 업데이트 후",'
                  ),
                  (
                      'subtitle = "설정이 그대로면 아무 작업이 필요 없습니다. 셔터음이 다시 들리면 설정 → 카메라 설정에서 [카메라 무음 다시 적용]을 사용해 주세요. [1회 설정 필요]가 표시될 때만 권한 연동을 다시 진행하면 됩니다."',
                      'subtitle = "One UI·Android 업데이트 후 카메라 셔터음 설정이 그대로면 아무 작업이 필요 없습니다. 셔터음이 다시 들리면 설정 → 카메라 설정에서 [카메라 무음 다시 적용]을 사용해 주세요. [1회 설정 필요]가 표시될 때만 권한 연동을 다시 진행하면 됩니다."'
                  ),
              ],
              'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/onboarding/FirstRunNoticeDialog.kt': [
                  (
                      '• One UI·Android 업데이트나 재부팅 뒤 카메라 셔터음 설정이 초기화될 수 있습니다. 매번 다시 설정할 필요는 없으며, 필요한 경우에만 알림으로 알려드립니다.',
                      '• One UI·Android 소프트웨어 업데이트 후 카메라 셔터음 설정이 초기화될 수 있습니다. 매번 다시 설정할 필요는 없으며, 필요한 경우에만 알림으로 알려드립니다.'
                  ),
              ],
              'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsHelpSection.kt': [
                  (
                      '일반적으로는 유지될 수 있지만 기기 상태나 소프트웨어 동작에 따라 카메라 셔터음 값이 기본 상태로 돌아갈 수 있습니다. 재부팅 뒤 실제 값이 초기화된 경우에만 앱이 다시 적용이 필요하다고 알려드립니다.',
                      '일반적인 재부팅에서는 카메라 셔터음 설정이 유지됩니다. ShutterSoundZero는 혹시 모를 상태 변화를 확인하기 위해 재부팅 후 실제 셔터음 설정값을 확인하며, 그대로 유지되어 있으면 아무 작업도 하지 않습니다.'
                  ),
                  (
                      'One UI·Android 업데이트나 재부팅 뒤 카메라 설정을 다시 적용해야 할 때, 또는 앱 업데이트 후 기존 권한 연동에 이상이 발견됐을 때처럼 사용자의 조치가 필요한 경우에 안내합니다. 정상 상태라면 별도의 조치 알림을 표시하지 않습니다.',
                      'One UI·Android 업데이트 후 카메라 셔터음 설정을 다시 적용해야 할 때, 또는 앱 업데이트 후 기존 권한 연동에 이상이 발견됐을 때처럼 사용자의 조치가 필요한 경우에 안내합니다. 정상 상태라면 별도의 조치 알림을 표시하지 않습니다.'
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Marker not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          Path('.github/workflows/apply-update-wording-cleanup.yml').unlink()
          PY

      - name: Commit wording cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt \
                  app/src/main/java/com/charmingcolor/shuttersoundzero/ui/onboarding/FirstRunNoticeDialog.kt \
                  app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsHelpSection.kt \
                  .github/workflows/apply-update-wording-cleanup.yml
          git commit -m 'fix: 소프트웨어 업데이트 안내에서 재부팅 표현 제거'
          git push origin HEAD:fix/first-run-shutter-sound-wording
