name: v1.4.2 안내 문구 최종 점검

on:
  push:
    branches:
      - fix/direct-csc-control-v1.4.2
    paths:
      - .github/.v142-copy-audit-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/direct-csc-control-v1.4.2

      - name: Apply copy and behavior audit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing target in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # README: "설정하고 잊어버리기" 흐름과 무선 디버깅 필요 조건을 정확히 설명
          path = 'README.md'
          rep(path,
              '화면을 실시간 감시하는 접근성 기반 방식 대신 삼성 갤럭시의 **순정 시스템(CSC) 설정값**을 활용합니다. 최초 1회 권한 연동 후 앱이나 빠른 설정 타일에서 카메라 셔터음 상태를 제어할 수 있습니다. 실제 설정을 변경할 때는 Android 보안 정책상 무선 디버깅이 켜져 있어야 하며, 앱은 실제 CSC 값을 다시 읽어 현재 기기 상태와 화면 표시가 일치하도록 관리합니다.',
              '화면을 실시간 감시하는 접근성 기반 방식 대신 삼성 갤럭시의 **순정 시스템(CSC) 설정값**을 활용합니다. 최초 1회 권한 연동과 카메라 무음 설정을 마치면 무선 디버깅을 꺼두고 앱을 계속 실행하지 않아도 적용된 설정이 유지됩니다. 나중에 셔터음 상태를 바꾸거나 다시 적용할 때만 무선 디버깅을 잠시 켜면 되며, 앱은 실제 CSC 값을 다시 읽어 현재 기기 상태와 화면 표시가 일치하도록 관리합니다.')
          rep(path,
              "   * 메인 화면의 스위치와 상태 문구는 저장된 앱 설정이 아니라 실제 `csc_pref_camera_forced_shuttersound_key` 값을 기준으로 표시합니다.",
              "   * 메인 화면의 상태 표시는 저장된 앱 설정이 아니라 실제 `csc_pref_camera_forced_shuttersound_key` 값을 기준으로 표시합니다.")
          rep(path,
              '''4. **🎛️ 빠른 설정(Quick Settings) 타일 지원**
   * 앱을 열지 않고도 알림창의 빠른 설정 패널에서 카메라 무음 상태를 빠르게 전환할 수 있습니다.

5. **🔄 재부팅 및 소프트웨어 업데이트 상태 확인**
   * 재부팅이나 소프트웨어 업데이트 이후 실제 CSC 상태를 확인합니다.
   * 무음 설정이 초기화된 경우 자동 복원으로 표시하지 않고, 무선 디버깅을 켠 뒤 다시 적용하도록 알림으로 안내합니다.
   * 시스템 보안 설정 권한까지 해제된 경우 메인 화면에서 [권한 요청]을 다시 진행해야 합니다.
   * 소프트웨어 업데이트 자동 감지는 앱 설정에서 켜거나 끌 수 있습니다.
''',
              '''4. **🎛️ 빠른 설정(Quick Settings) 타일 지원**
   * 알림창의 빠른 설정 패널에서도 카메라 무음 상태를 바꿀 수 있습니다.
   * 실제 상태를 변경하는 순간에는 무선 디버깅이 켜져 있어야 하며, 변경이 성공하면 앱이 무선 디버깅을 다시 끄려고 시도합니다.

5. **🔄 재부팅 및 소프트웨어 업데이트 후 상태 확인**
   * 재부팅이나 소프트웨어 업데이트 뒤에도 무음 설정이 그대로 유지되어 있으면 아무 작업이 필요 없으며 불필요한 알림도 띄우지 않습니다.
   * 설정이 초기화된 경우에만 무선 디버깅을 잠시 켜고 앱에서 [카메라 무음 다시 적용]을 사용하도록 안내합니다.
   * 시스템 보안 설정 권한까지 해제된 경우에만 [1회 설정 시작]을 다시 진행해야 합니다.
   * [소프트웨어 업데이트 후 상태 확인] 기능은 앱 설정에서 켜거나 끌 수 있습니다.
''')
          rep(path,
              '''7. **🧹 개발자 옵션 정리 지원**
   * 최초 권한 설정을 마친 뒤 개발자 옵션과 USB·무선 디버깅을 끄는 과정을 앱 설정에서 도와줍니다.
   * 이미 부여된 `WRITE_SECURE_SETTINGS` 권한은 개발자 옵션을 꺼도 유지됩니다. 다만 카메라 셔터음 설정을 실제로 변경할 때는 무선 디버깅을 다시 켜야 합니다.
''',
              '''7. **🧹 설정 완료 후 무선 디버깅 정리**
   * 최초 설정이나 셔터음 상태 변경이 성공하면 앱이 무선 디버깅을 자동으로 끄려고 시도합니다.
   * 자동으로 끄지 못한 기기에서는 Wi-Fi 연결 시 무선 디버깅 허용 여부를 묻는 시스템 알림이 반복되지 않도록 직접 끄는 방법을 바로 안내합니다.
   * 개발자 옵션 자체와 USB 디버깅까지 모두 끄고 싶은 경우에는 앱 설정의 [개발자 옵션 전체 끄기]를 선택적으로 사용할 수 있습니다.
   * 이미 부여된 `WRITE_SECURE_SETTINGS` 권한과 적용된 카메라 무음 설정은 무선 디버깅이나 개발자 옵션을 꺼도 유지됩니다.
''')
          rep(path, '[1단계: 권한 요청]', '[1단계: 1회 설정 시작]')
          rep(path, '  ➔ Wi-Fi에 연결한 상태에서 앱 메인 화면의 [권한 요청] 버튼을 누릅니다.', '  ➔ Wi-Fi에 연결한 상태에서 앱 메인 화면의 [1회 설정 시작] 버튼을 누릅니다.')
          rep(path, '  ➔ 6자리 코드를 입력하면 권한 연동과 카메라 무음 설정이 진행됩니다.', '  ➔ 6자리 코드를 입력하면 권한 연동과 카메라 무음 설정을 한 번에 적용하고, 성공하면 앱이 무선 디버깅을 자동으로 끄려고 시도합니다.')
          rep(path,
              '> **💡 설정 완료 후**: 권한 연동이 끝나면 [무선 디버깅]을 꺼도 이미 적용된 카메라 무음 상태와 `WRITE_SECURE_SETTINGS` 권한은 유지됩니다. 이후 셔터음 상태를 다시 변경할 때만 무선 디버깅을 켜면 됩니다. 필요하면 앱의 **설정 → 개발자 옵션 끄기** 기능을 사용할 수 있습니다.',
              '> **💡 설정 완료 후**: 앱이 무선 디버깅을 자동으로 끄려고 시도합니다. 자동 종료가 실패하면 화면 안내에 따라 직접 꺼 주세요. 적용된 카메라 무음 상태와 `WRITE_SECURE_SETTINGS` 권한은 무선 디버깅을 꺼도 유지되므로 앱을 계속 실행해 둘 필요가 없습니다. 이후 셔터음 상태를 바꾸거나 다시 적용할 때만 무선 디버깅을 잠시 켜면 됩니다.')
          rep(path,
              '* 셔터음 설정을 새로 변경할 때 Android 보안 정책상 무선 디버깅이 일시적으로 필요할 수 있습니다.',
              '* 현재 ShutterSoundZero는 비공개 CSC 설정을 로컬 ADB로 변경하므로 셔터음 상태를 바꾸거나 다시 적용하는 순간에만 무선 디버깅이 필요합니다.')

          # 메인 화면: 자동 종료는 기기 구현에 따라 실패할 수 있음을 명시
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt'
          rep(path,
              '"[1회 설정 시작]에서 6자리 페어링 코드만 입력하면 권한 연동과 무음 설정을 한 번에 적용하고, 완료 후 무선 디버깅도 자동으로 끕니다."',
              '"[1회 설정 시작]에서 6자리 페어링 코드만 입력하면 권한 연동과 무음 설정을 한 번에 적용합니다. 완료 후에는 무선 디버깅을 자동으로 끄려고 시도하고, 실패하면 바로 안내합니다."')
          rep(path,
              'message = "무선 디버깅 권한을 연동하려면 기기가 Wi-Fi 네트워크에 연결되어 있어야 합니다.\\n\\nWi-Fi 설정에서 네트워크에 연결한 뒤 다시 권한 요청을 진행해 주세요."',
              'message = "1회 설정을 진행하려면 기기가 Wi-Fi 네트워크에 연결되어 있어야 합니다.\\n\\nWi-Fi 설정에서 네트워크에 연결한 뒤 [1회 설정 시작]을 다시 눌러 주세요."')
          rep(path,
              '"개발자 옵션의 [페어링 코드로 기기 페어링] 화면에서 상단바를 내려 6자리 숫자만 입력하면 됩니다. 앱이 권한 연동과 무음 설정을 적용한 뒤 무선 디버깅도 자동으로 끕니다."',
              '"개발자 옵션의 [페어링 코드로 기기 페어링] 화면에서 상단바를 내려 6자리 숫자만 입력하면 됩니다. 앱이 권한 연동과 무음 설정을 적용한 뒤 무선 디버깅을 자동으로 끄려고 시도하고, 실패하면 직접 끄도록 바로 안내합니다."')

          # ViewModel: 사용하지 않는 보조 페어링 경로도 실패를 성공으로 오인하지 않도록 정리
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreenViewModel.kt'
          rep(path,
              '''            } else {
                refreshState()
                _uiState.update {
                    it.copy(
                        isWirelessPairingInProgress = false,
                        wirelessPairingError = null,
                        infoMessage = "✅ 기기 페어링이 완료되었습니다! 셔터음 무음 스위치를 켜주세요."
                    )
                }
                onComplete(true)
            }
''',
              '''            } else {
                refreshState()
                _uiState.update {
                    it.copy(
                        isWirelessPairingInProgress = false,
                        wirelessPairingError = "페어링은 완료됐지만 카메라 무음 설정 적용에 실패했습니다. 무선 디버깅 상태를 확인한 뒤 다시 시도해 주세요.",
                        infoMessage = null
                    )
                }
                onComplete(false)
            }
''')
          rep(path,
              'it.copy(errorMessage = "보안 설정 변경 권한이 필요합니다. 아래 [권한 설정]을 진행해 주세요.")',
              'it.copy(errorMessage = "시스템 보안 설정 권한이 필요합니다. 아래 [초기 설정 및 복구]에서 [1회 설정 시작]을 진행해 주세요.")')

          # 실제 알림/서비스의 버튼 이름도 현재 UI와 일치시킴
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/service/PairingForegroundService.kt'
          rep(path,
              'statusDetail = "앱으로 돌아가 [권한 요청]을 누르세요."',
              'statusDetail = "앱으로 돌아가 [1회 설정 시작]을 누르세요."')

          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/notification/PairingNotificationHelper.kt'
          rep(path,
              '"카메라 무음 설정은 완료됐습니다. Wi-Fi 연결 알림을 피하려면 무선 디버깅을 직접 꺼 주세요."',
              '"카메라 무음 설정은 완료됐습니다. Wi-Fi 연결 시 무선 디버깅 허용 여부를 묻는 시스템 알림이 반복되지 않도록 무선 디버깅을 직접 꺼 주세요."')

          # BootReceiver: 실제 새 버튼명과 재적용 동작으로 통일
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/receiver/BootReceiver.kt'
          rep(path, '재부팅·소프트웨어 업데이트로 무음 상태가 초기화된 경우 자동 복원을 시도하지 않는다.', '재부팅·소프트웨어 업데이트로 무음 상태가 초기화된 경우 앱이 백그라운드에서 자동 재적용하지 않는다.')
          text = Path(path).read_text(encoding='utf-8')
          text = text.replace('[권한 요청]', '[1회 설정 시작]')
          text = text.replace('앱에서 [카메라 셔터음 끄기]를 다시 켜 주세요.', '앱에서 [카메라 무음 다시 적용]을 눌러 주세요.')
          text = text.replace('"소프트웨어 업데이트 알림"', '"카메라 무음 상태 알림"')
          Path(path).write_text(text, encoding='utf-8')

          # Settings: "전체 끄기"와 자동 종료 시도 표현을 일치시킴
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsScreen.kt'
          rep(path,
              'subtitle = "선택 사항 · 앱은 설정 완료 후 무선 디버깅만 자동으로 종료",',
              'subtitle = "선택 사항 · 앱은 설정 완료 후 무선 디버깅 자동 종료를 시도",')
          text = Path(path).read_text(encoding='utf-8').replace('title = { Text("개발자 옵션 끄기") }', 'title = { Text("개발자 옵션 전체 끄기") }')
          Path(path).write_text(text, encoding='utf-8')

          # Quick Settings 설명도 WD가 켜진 동안만 상태 변경한다는 점을 명시
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/service/CameraMuteTileService.kt'
          rep(path,
              ' * 사용자가 상단 알림창을 내려 원클릭으로 카메라 무음 연동을 켜고 끌 수 있습니다.',
              ' * 무선 디버깅이 켜진 동안 사용자가 빠른 설정 패널에서 카메라 무음 상태를 바꿀 수 있습니다.')

          # 호환성 문서의 테스트 기준과 오래된 자동 복원 표현 정리
          path = 'docs/COMPATIBILITY.md'
          rep(path,
              '- 페어링 후 무선 디버깅을 꺼도 적용된 설정이 유지되는지',
              '- 설정 완료 후 무선 디버깅이 자동으로 꺼지는지\n- 무선 디버깅을 끈 뒤에도 적용된 설정이 유지되는지\n- Wi-Fi를 다시 연결했을 때 무선 디버깅 허용 여부를 묻는 시스템 알림이 반복되지 않는지')
          rep(path,
              '- 타일을 통해 설정을 정상적으로 켜고 끌 수 있는지',
              '- 무선 디버깅을 잠시 켠 상태에서 타일로 설정을 정상적으로 바꾸고, 성공 후 무선 디버깅이 다시 꺼지는지')
          rep(path, '- 부팅 후 자동 복원 로직 변경', '- 부팅 후 상태 확인 및 재적용 안내 로직 변경')

          # 클래스 설명도 일반 흐름은 WD만 정리한다는 점으로 보정
          path = 'app/src/main/java/com/charmingcolor/shuttersoundzero/core/DeveloperOptionsManager.kt'
          rep(path,
