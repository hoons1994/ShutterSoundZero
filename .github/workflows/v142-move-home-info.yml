name: v1.4.2 홈 안내 순서 조정

on:
  push:
    branches:
      - fix/v142-reapply-in-settings
    paths:
      - .github/scripts/v142_move_home_info.py
      - .github/workflows/v142-move-home-info.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v142-reapply-in-settings

      - name: Apply home ordering changes
        run: python3 .github/scripts/v142_move_home_info.py

      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm -f .github/scripts/v142_move_home_info.py
          rm -f .github/workflows/v142-move-home-info.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 홈 화면 안내문을 동작 버튼 아래로 정리"
          git push origin HEAD:fix/v142-reapply-in-settings
