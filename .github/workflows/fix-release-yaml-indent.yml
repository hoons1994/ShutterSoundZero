name: Fix Release YAML Indentation

on:
  push:
    branches:
      - ci/release-main-dispatch
    paths:
      - '.github/workflows/fix-release-yaml-indent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/release-main-dispatch
          fetch-depth: 0

      - name: Fix YAML indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-release.yml')
          lines = path.read_text().splitlines()

          try:
              i = lines.index('  workflow_dispatch:')
          except ValueError:
              raise SystemExit('workflow_dispatch marker not found')
          expected = [
              '  inputs:',
              '    release_tag:',
              "      description: 'Release tag to publish (leave empty for signed preflight)'",
              '      required: false',
              '      type: string',
          ]
          if lines[i + 1:i + 6] != expected:
              raise SystemExit(f'unexpected workflow_dispatch block: {lines[i + 1:i + 6]}')
          for j in range(i + 1, i + 6):
              lines[j] = '  ' + lines[j]

          try:
              start = lines.index('      - name: Resolve release tag')
              end = lines.index('      - name: Verify tag belongs to main', start + 1)
          except ValueError:
              raise SystemExit('resolve/verify step markers not found')
          for j in range(start + 1, end):
              if lines[j]:
                  lines[j] = '  ' + lines[j]

          path.write_text('\n'.join(lines) + '\n')
          PY

          git rm .github/workflows/fix-release-yaml-indent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/android-release.yml
          git commit -m 'fix: correct Android Release workflow YAML'
          git push origin HEAD:ci/release-main-dispatch
