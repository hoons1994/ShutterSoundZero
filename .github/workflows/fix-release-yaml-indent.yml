name: Fix Release YAML Indentation

on:
  push:
    branches:
      - ci/release-main-dispatch
    paths:
      - '.github/workflows/fix-release-yaml-indent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/release-main-dispatch
          fetch-depth: 0

      - name: Fix YAML indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-release.yml')
          text = path.read_text()

          old_top = """  workflow_dispatch:
          inputs:
            release_tag:
              description: 'Release tag to publish (leave empty for signed preflight)'
              required: false
              type: string
          """
          # Normalize indentation introduced by the previous generated patch.
          old_top = old_top.replace('          inputs:', '  inputs:').replace('            release_tag:', '    release_tag:').replace("              description:", "      description:").replace('              required:', '      required:').replace('              type:', '      type:')
          new_top = """  workflow_dispatch:
            inputs:
              release_tag:
                description: 'Release tag to publish (leave empty for signed preflight)'
                required: false
                type: string
          """
          if old_top not in text:
              raise SystemExit('malformed workflow_dispatch block not found')
          text = text.replace(old_top, new_top, 1)

          old_resolve = """      - name: Resolve release tag
          shell: bash
          run: |
            RELEASE_TAG=\"$(jq -r '.inputs.release_tag // empty' \"$GITHUB_EVENT_PATH\")\"
            if ! [[ \"$RELEASE_TAG\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
              echo \"Invalid release tag: $RELEASE_TAG\"
              exit 1
            fi
            git fetch --force origin \"refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG\"
            RELEASE_SOURCE_SHA=\"$(git rev-parse \"refs/tags/$RELEASE_TAG^{commit}\")\"
            git checkout --detach \"$RELEASE_SOURCE_SHA\"
            echo \"RELEASE_TAG=$RELEASE_TAG\" >> \"$GITHUB_ENV\"
            echo \"RELEASE_SOURCE_SHA=$RELEASE_SOURCE_SHA\" >> \"$GITHUB_ENV\"
          """
          old_resolve = old_resolve.replace('          shell: bash', '      shell: bash').replace('          run: |', '      run: |').replace('            RELEASE_TAG=', '        RELEASE_TAG=').replace('            if ! [[', '        if ! [[').replace('              echo', '          echo').replace('              exit 1', '          exit 1').replace('            fi', '        fi').replace('            git fetch', '        git fetch').replace('            RELEASE_SOURCE_SHA=', '        RELEASE_SOURCE_SHA=').replace('            git checkout', '        git checkout').replace('            echo \"RELEASE_TAG=', '        echo \"RELEASE_TAG=').replace('            echo \"RELEASE_SOURCE_SHA=', '        echo \"RELEASE_SOURCE_SHA=')
          new_resolve = """      - name: Resolve release tag
                shell: bash
                run: |
                  RELEASE_TAG=\"$(jq -r '.inputs.release_tag // empty' \"$GITHUB_EVENT_PATH\")\"
                  if ! [[ \"$RELEASE_TAG\" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
                    echo \"Invalid release tag: $RELEASE_TAG\"
                    exit 1
                  fi
                  git fetch --force origin \"refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG\"
                  RELEASE_SOURCE_SHA=\"$(git rev-parse \"refs/tags/$RELEASE_TAG^{commit}\")\"
                  git checkout --detach \"$RELEASE_SOURCE_SHA\"
                  echo \"RELEASE_TAG=$RELEASE_TAG\" >> \"$GITHUB_ENV\"
                  echo \"RELEASE_SOURCE_SHA=$RELEASE_SOURCE_SHA\" >> \"$GITHUB_ENV\"
          """
          new_resolve = new_resolve.replace('                shell: bash', '        shell: bash').replace('                run: |', '        run: |').replace('                  RELEASE_TAG=', '          RELEASE_TAG=').replace('                  if ! [[', '          if ! [[').replace('                    echo', '            echo').replace('                    exit 1', '            exit 1').replace('                  fi', '          fi').replace('                  git fetch', '          git fetch').replace('                  RELEASE_SOURCE_SHA=', '          RELEASE_SOURCE_SHA=').replace('                  git checkout', '          git checkout').replace('                  echo \"RELEASE_TAG=', '          echo \"RELEASE_TAG=').replace('                  echo \"RELEASE_SOURCE_SHA=', '          echo \"RELEASE_SOURCE_SHA=')
          if old_resolve not in text:
              raise SystemExit('malformed resolve step not found')
          text = text.replace(old_resolve, new_resolve, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/fix-release-yaml-indent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/android-release.yml
          git commit -m 'fix: correct Android Release workflow YAML'
          git push origin HEAD:ci/release-main-dispatch
