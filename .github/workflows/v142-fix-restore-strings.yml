name: v1.4.2 복원 안내 문자열 수정

on:
  push:
    branches:
      - fix/direct-csc-control-v1.4.2
    paths:
      - .github/.v142-restore-string-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/direct-csc-control-v1.4.2

      - name: Fix strings
        run: python3 .github/scripts/fix_v142_restore_strings.py

      - name: Remove temporary tooling and commit
        run: |
          rm -f .github/scripts/fix_v142_restore_strings.py
          rm -f .github/workflows/v142-fix-restore-strings.yml
          rm -f .github/.v142-restore-string-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 카메라 복원 안내 문자열 정리"
          git push origin HEAD:fix/direct-csc-control-v1.4.2
