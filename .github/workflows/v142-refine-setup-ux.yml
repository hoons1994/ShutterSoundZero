name: v1.4.2 설정 완료 UX 정리

on:
  push:
    branches:
      - fix/direct-csc-control-v1.4.2
    paths:
      - .github/.v142-ux-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/direct-csc-control-v1.4.2

      - name: Apply setup UX refinements
        run: |
          sed -i 's/^    """초기 설정/    "초기 설정/' .github/scripts/refine_v142_setup_ux.py
          sed -i 's/소프트웨어 업데이트 후 카메라 무음 설정 상태 및 복원 안내/재부팅·소프트웨어 업데이트 후 카메라 무음 상태 및 재적용 안내/' .github/scripts/refine_v142_setup_ux.py
          sed -i 's/소프트웨어 업데이트 후 카메라 무음 설정 상태 확인 및 재적용 안내/재부팅·소프트웨어 업데이트 후 카메라 무음 상태 확인 및 재적용 안내/' .github/scripts/refine_v142_setup_ux.py
          python3 .github/scripts/refine_v142_setup_ux.py

      - name: Remove temporary tooling and commit
        run: |
          rm -f .github/scripts/refine_v142_setup_ux.py
          rm -f .github/workflows/v142-refine-setup-ux.yml
          rm -f .github/.v142-ux-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 설정 완료 후 무선 디버깅 자동 종료와 안내 개선"
          git push origin HEAD:fix/direct-csc-control-v1.4.2
