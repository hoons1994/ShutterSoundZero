name: Apply clean guidance copy

on:
  push:
    branches:
      - ui/clean-main-guidance-copy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/clean-main-guidance-copy
          fetch-depth: 0

      - name: Apply guidance cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'marker not found: {label}')
              return text.replace(old, new, 1)

          main = Path('app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt')
          text = main.read_text()
          pairs = [
              ('uiState.isCscMuted -> "앱을 계속 열어둘 필요가 없습니다"', 'uiState.isCscMuted -> "사용 안내"', 'main muted title'),
              ('hasEffectivePermission -> "권한은 유지되어 있습니다"', 'hasEffectivePermission -> "재적용 안내"', 'main reapply title'),
              ('else -> "처음 한 번만 설정하면 됩니다"', 'else -> "1회 설정 안내"', 'main setup title'),
              ('"진동·무음 모드에서 카메라 셔터음이 나지 않도록 설정되어 있습니다. 평소에는 무선 디버깅을 꺼두는 것이 정상이며, 나중에 설정을 바꿀 때만 잠시 다시 켜면 됩니다."', '"설정이 완료되면 앱을 계속 열어둘 필요가 없습니다. 평소에는 무선 디버깅을 꺼두고, 카메라 셔터음 설정을 바꿀 때만 잠시 켜면 됩니다."', 'main muted description'),
              ('"현재 카메라 무음 설정이 적용되어 있지 않습니다. 설정 → 카메라 설정에서 [카메라 무음 다시 적용]을 사용해 주세요. 상태를 바꾸는 동안에만 무선 디버깅을 잠시 켜면 됩니다."', '"설정 → 카메라 설정에서 [카메라 무음 다시 적용]을 사용해 주세요. 적용할 때만 무선 디버깅을 잠시 켜면 됩니다."', 'main reapply description'),
              ('"[1회 설정 시작]에서 6자리 페어링 코드만 입력하면 권한 연동과 무음 설정을 한 번에 적용합니다. 완료 후에는 무선 디버깅 자동 종료를 시도하고, 자동으로 끄지 못하면 바로 안내합니다."', '"[1회 설정 시작]에서 6자리 페어링 코드를 입력하면 권한 연동과 무음 설정을 함께 진행합니다."', 'main setup description'),
              ('title = "소프트웨어 업데이트 후"', 'title = "소프트웨어 업데이트 안내"', 'software update title'),
              ('"One UI·Android 업데이트 후 카메라 셔터음 설정이 그대로면 아무 작업이 필요 없습니다. 셔터음이 다시 들리면 설정 → 카메라 설정에서 [카메라 무음 다시 적용]을 사용해 주세요. [1회 설정 필요]가 표시될 때만 권한 연동을 다시 진행하면 됩니다."', '"One UI 또는 Android 업데이트 후 셔터음 설정이 그대로면 아무 작업이 필요 없습니다. 셔터음이 다시 들릴 때만 [카메라 무음 다시 적용]을 사용하고, [1회 설정 필요]가 표시된 경우에만 기기 연동을 다시 진행하면 됩니다."', 'software update description'),
              ('text = "알림 팝업이 간략하게 보이나요?"', 'text = "알림 팝업 안내"', 'notification title'),
              ('style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.Bold)', 'style = MaterialTheme.typography.titleMedium.copy(fontWeight = FontWeight.Bold)', 'notification title size'),
          ]
          for old, new, label in pairs:
              text = replace_once(text, old, new, label)
          main.write_text(text)

          settings = Path('app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsScreen.kt')
          text = settings.read_text()
          pairs = [
              ('subtitle = "현재 무음 설정이 적용되어 있습니다 · 복원하는 동안 무선 디버깅을 잠시 켜야 합니다"', 'subtitle = "무음 설정 적용됨 · 복원할 때만 무선 디버깅 필요"', 'settings muted action subtitle'),
              ('subtitle = "현재 셔터음이 기본 상태입니다 · 적용하는 동안 무선 디버깅을 잠시 켜야 합니다"', 'subtitle = "기본 셔터음 상태 · 다시 적용할 때만 무선 디버깅 필요"', 'settings normal action subtitle'),
          ]
          for old, new, label in pairs:
              text = replace_once(text, old, new, label)

          old = '                InfoRow(\n                    title = if (isCscMuted) {\n                        "현재 카메라 무음이 적용되어 있습니다"\n                    } else {\n                        "현재 카메라 셔터음이 기본 상태입니다"\n                    },\n                    subtitle = if (isCscMuted) {\n                        "원래대로 복원할 때만 무선 디버깅을 잠시 켜면 됩니다. 복원이 끝나면 앱이 무선 디버깅을 다시 끄려고 시도합니다."\n                    } else {\n                        "카메라 무음을 다시 적용할 때만 무선 디버깅을 잠시 켜면 됩니다. 적용이 끝나면 앱이 무선 디버깅을 다시 끄려고 시도합니다."\n                    }\n                )'
          new = '                InfoRow(\n                    title = "카메라 설정 안내",\n                    subtitle = if (isCscMuted) {\n                        "셔터음을 원래대로 복원할 때만 무선 디버깅을 잠시 켜면 됩니다. 작업이 끝나면 앱이 무선 디버깅 자동 종료를 시도합니다."\n                    } else {\n                        "카메라 무음을 다시 적용할 때만 무선 디버깅을 잠시 켜면 됩니다. 작업이 끝나면 앱이 무선 디버깅 자동 종료를 시도합니다."\n                    }\n                )'
          text = replace_once(text, old, new, 'settings camera guidance block')
          settings.write_text(text)

          main_text = main.read_text()
          settings_text = settings.read_text()
          required = [
              ('사용 안내', main_text),
              ('재적용 안내', main_text),
              ('1회 설정 안내', main_text),
              ('소프트웨어 업데이트 안내', main_text),
              ('알림 팝업 안내', main_text),
              ('titleMedium.copy(fontWeight = FontWeight.Bold)', main_text),
              ('카메라 설정 안내', settings_text),
              ('무음 설정 적용됨 · 복원할 때만 무선 디버깅 필요', settings_text),
              ('기본 셔터음 상태 · 다시 적용할 때만 무선 디버깅 필요', settings_text),
          ]
          for needle, haystack in required:
              if needle not in haystack:
                  raise SystemExit(f'verification failed: {needle}')

          Path('.github/workflows/apply-clean-guidance-copy.yml').unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/ui/main/MainScreen.kt \
                  app/src/main/java/com/charmingcolor/shuttersoundzero/ui/settings/SettingsScreen.kt \
                  .github/workflows/apply-clean-guidance-copy.yml
          git commit -m 'ui: 주요 안내 문구를 간결하게 정리'
          git push origin HEAD:ui/clean-main-guidance-copy
