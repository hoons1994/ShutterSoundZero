name: Patch Release Dispatch

on:
  push:
    branches:
      - chore/enable-tag-release-dispatch
    paths:
      - '.github/workflows/patch-release-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/enable-tag-release-dispatch
          fetch-depth: 0

      - name: Enable tag workflow_dispatch and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/android-release.yml')
          text = path.read_text()
          old = "    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
          new = "    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')"
          if old not in text:
              raise SystemExit('Expected release job condition was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/patch-release-dispatch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/android-release.yml
          git commit -m 'ci: allow tag release via workflow dispatch'
          git push origin HEAD:chore/enable-tag-release-dispatch
