name: Publish Dependency Graph
run-name: Publish dependency graph for ${{ github.event.workflow_run.head_sha }} (${{ github.event.workflow_run.event }})

on:
  workflow_run:
    workflows: [Dependency Submission]
    types: [completed]

permissions:
  contents: read

jobs:
  submit:
    name: Submit dependency graph
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      # workflow_run's SHA is on the default branch. Never execute PR-supplied validators.
      - name: Checkout trusted snapshot validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate and submit source-run dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-dependency-snapshot.mjs
