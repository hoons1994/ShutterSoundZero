name: 반자동 앱 업데이트 패치 적용

on:
  push:
    branches:
      - feat/semi-auto-app-update
    paths:
      - '.github/workflows/apply-semi-auto-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/semi-auto-app-update
          fetch-depth: 1

      - name: Apply semi-automatic update patch
        run: |
          python3 .github/scripts/apply_semi_auto_update.py
          git diff --check

      - name: Commit production changes and remove temporary patch files
        run: |
          rm -f .github/scripts/apply_semi_auto_update.py
          rm -f .github/workflows/apply-semi-auto-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 반자동 앱 업데이트 확인과 원탭 설치 흐름 추가'
          git push origin HEAD:feat/semi-auto-app-update
