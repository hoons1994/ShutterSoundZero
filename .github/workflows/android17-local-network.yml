name: Android 17 Local Network CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-local-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-network-permission:
    name: Android 17 Local Network Permission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Resolve and install Android 17 emulator
        shell: bash
        run: |
          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            grep -E 'platforms;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          for candidate in \
            'system-images;android-CinnamonBun;default;x86_64' \
            'system-images;android-37;default;x86_64' \
            'system-images;android-CinnamonBun;google_apis;x86_64' \
            'system-images;android-37;google_apis;x86_64'; do
            if grep -Fq "$candidate" sdk-packages.txt; then
              IMAGE_PACKAGE="$candidate"
              break
            fi
          done

          if [ -z "${IMAGE_PACKAGE:-}" ]; then
            echo 'Android 17 x86_64 system image was not found.'
            grep -E 'system-images;android-(CinnamonBun|37)' sdk-packages.txt || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $IMAGE_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0' platform-tools emulator "$IMAGE_PACKAGE"
          echo "ANDROID17_IMAGE_PACKAGE=$IMAGE_PACKAGE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Configure AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android17-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android17-avd"

      - name: Create Android 17 emulator
        shell: bash
        run: |
          echo no | avdmanager create avd \
            --force \
            --name shuttersoundzero-api37 \
            --package "$ANDROID17_IMAGE_PACKAGE" \
            --device pixel

      - name: Start Android 17 emulator
        shell: bash
        run: |
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$EMULATOR" -avd shuttersoundzero-api37 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android17-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android17-emulator.pid"

      - name: Wait for Android 17 emulator boot
        shell: bash
        run: |
          EMULATOR_PID="$(cat "$RUNNER_TEMP/android17-emulator.pid")"

          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android 17 emulator process exited before boot completed.'
              cat "$RUNNER_TEMP/android17-emulator.log" || true
              exit 1
            fi

            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then
              BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$BOOT_COMPLETED" == "1" ]]; then
                SDK_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
                if [ "$SDK_LEVEL" -lt 37 ]; then
                  echo "Expected API 37+, got API $SDK_LEVEL."
                  exit 1
                fi
                adb shell input keyevent 82 || true
                adb shell settings put global window_animation_scale 0
                adb shell settings put global transition_animation_scale 0
                adb shell settings put global animator_duration_scale 0
                exit 0
              fi
            fi

            sleep 2
          done

          echo 'Android 17 emulator did not finish booting within 5 minutes.'
          adb devices -l || true
          cat "$RUNNER_TEMP/android17-emulator.log" || true
          exit 1

      - name: Run Android 17 local-network permission tests
        run: >-
          ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
          -Pandroid.testInstrumentationRunnerArguments.class=com.charmingcolor.shuttersoundzero.core.adb.LocalNetworkAccessInstrumentedTest

      - name: Print emulator log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/android17-emulator.log" || true
