name: v1.4.4 카메라 설정 상태별 동작 패치

on:
  push:
    branches:
      - fix/v144-camera-settings-state-action
    paths:
      - '.github/scripts/v144_fix_camera_settings_state_action.py'
      - '.github/workflows/v144-camera-settings-state-action.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v144-camera-settings-state-action
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/v144_fix_camera_settings_state_action.py
      - name: Remove temporary patch files and commit
        run: |
          rm -f .github/scripts/v144_fix_camera_settings_state_action.py
          rm -f .github/workflows/v144-camera-settings-state-action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 카메라 설정 동작을 현재 셔터음 상태에 맞게 표시"
          git push origin HEAD:fix/v144-camera-settings-state-action
