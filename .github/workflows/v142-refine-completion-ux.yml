name: v1.4.2 완료 화면 UX 정리

on:
  push:
    branches:
      - fix/direct-csc-control-v1.4.2
    paths:
      - .github/.v142-completion-ux-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/direct-csc-control-v1.4.2

      - name: Apply UX refinements
        run: python3 .github/scripts/refine_v142_completion_ux.py

      - name: Remove temporary tooling and commit
        run: |
          rm -f .github/scripts/refine_v142_completion_ux.py
          rm -f .github/workflows/v142-refine-completion-ux.yml
          rm -f .github/.v142-completion-ux-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 완료 화면과 카메라 복원 흐름 단순화"
          git push origin HEAD:fix/direct-csc-control-v1.4.2
