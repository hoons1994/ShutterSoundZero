name: v1.4.2 재적용 설정 이동 패치

on:
  push:
    branches:
      - fix/v142-reapply-in-settings
    paths:
      - .github/workflows/v142-reapply-settings-patch.yml
      - .github/scripts/v142_reapply_settings_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v142-reapply-in-settings

      - name: Apply patch
        run: python3 .github/scripts/v142_reapply_settings_patch.py

      - name: Remove temporary files and commit
        shell: bash
        run: |
          rm -f .github/workflows/v142-reapply-settings-patch.yml
          rm -f .github/scripts/v142_reapply_settings_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 카메라 무음 재적용 기능을 설정 화면으로 이동"
          git push origin HEAD:fix/v142-reapply-in-settings
