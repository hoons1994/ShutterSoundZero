name: Apply Pairing Success Fix

on:
  push:
    branches:
      - fix/pairing-success-false-error

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pairing-success-false-error
          fetch-depth: 0

      - name: Apply focused fix
        shell: python
        run: |
          from pathlib import Path

          service = Path("app/src/main/java/com/charmingcolor/shuttersoundzero/service/PairingForegroundService.kt")
          text = service.read_text()
          old = '''            } catch (e: Exception) {
                logFailure("Pairing error", e)
                PairingNotificationHelper.showPairingNotification(
                    this@PairingForegroundService,
                    null,
                    "❌ 페어링 중 오류가 발생했습니다. 무선 디버깅 상태를 확인하고 다시 시도해 주세요."
                )
            } finally {'''
          new = '''            } catch (e: java.util.concurrent.CancellationException) {
                // Successful completion stops the foreground service, which cancels its coroutine
                // scope. Cancellation during that shutdown is expected and must not overwrite the
                // success notification with a false pairing-error notification.
                Log.i(TAG, "Pairing workflow cancelled during service shutdown")
                throw e
            } catch (e: Exception) {
                logFailure("Pairing error", e)
                PairingNotificationHelper.showPairingNotification(
                    this@PairingForegroundService,
                    null,
                    "❌ 페어링 중 오류가 발생했습니다. 무선 디버깅 상태를 확인하고 다시 시도해 주세요."
                )
            } finally {'''
          if old not in text:
              raise SystemExit("Pairing service target block not found")
          service.write_text(text.replace(old, new, 1))

          helper = Path("app/src/main/java/com/charmingcolor/shuttersoundzero/ui/notification/PairingNotificationHelper.kt")
          text = helper.read_text()
          old = '''            statusMessage != null && pairingPort != null -> "$statusMessage\\n알림의 [코드 입력]을 눌러 화면에 표시된 6자리 코드를 입력해 주세요."
            statusMessage != null -> "$statusMessage\\n화면의 안내에 따라 페어링을 계속해 주세요."'''
          new = '''            statusMessage != null && pairingPort != null -> "알림의 [코드 입력]을 눌러 화면에 표시된 6자리 코드를 입력해 주세요."
            statusMessage != null -> "화면의 안내에 따라 페어링을 계속해 주세요."'''
          if old not in text:
              raise SystemExit("Notification helper target block not found")
          helper.write_text(text.replace(old, new, 1))

      - name: Remove one-shot workflow and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pairing-success-fix.yml
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/service/PairingForegroundService.kt
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/ui/notification/PairingNotificationHelper.kt
          git commit -m "fix: avoid false pairing error after success"
          git push origin HEAD:fix/pairing-success-false-error
