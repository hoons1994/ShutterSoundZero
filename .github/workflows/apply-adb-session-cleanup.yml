name: Apply ADB session cleanup

on:
  push:
    branches:
      - fix/first-run-shutter-sound-wording

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/first-run-shutter-sound-wording
          fetch-depth: 0

      - name: Disconnect ADB sessions after successful commands
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/charmingcolor/shuttersoundzero/core/adb/StandaloneAdbManager.kt')
          text = path.read_text()

          old = '''            prefs.shouldMuteOnBoot = true
            prefs.isPermissionRevokedByUser = false

            Result.success(Unit)
'''
          new = '''            prefs.shouldMuteOnBoot = true
            prefs.isPermissionRevokedByUser = false

            // 이후 무선 디버깅을 끄더라도 죽은 TLS 세션이 연결 상태로 남지 않게 정리한다.
            disconnectAfterSuccessfulCommand("initial camera mute setup")
            Result.success(Unit)
'''
          if old not in text:
              raise SystemExit('applyCameraMuteViaAdb success block not found')
          text = text.replace(old, new, 1)

          old = '''                    prefs.shouldMuteOnBoot = enableMute
                    Log.i(TAG, "Reused active ADB session for camera setting")
                    return@withContext Result.success(Unit)
'''
          new = '''                    prefs.shouldMuteOnBoot = enableMute
                    Log.i(TAG, "Reused active ADB session for camera setting")
                    disconnectAfterSuccessfulCommand("reused camera setting session")
                    return@withContext Result.success(Unit)
'''
          if old not in text:
              raise SystemExit('setCameraMute reused-session block not found')
          text = text.replace(old, new, 1)

          old = '''            executeShellCommand("settings put system csc_pref_camera_forced_shuttersound_key $targetVal")
            prefs.shouldMuteOnBoot = enableMute
            Log.i(TAG, "Camera setting updated successfully via ADB")
            Result.success(Unit)
'''
          new = '''            executeShellCommand("settings put system csc_pref_camera_forced_shuttersound_key $targetVal")
            prefs.shouldMuteOnBoot = enableMute
            Log.i(TAG, "Camera setting updated successfully via ADB")
            disconnectAfterSuccessfulCommand("camera setting update")
            Result.success(Unit)
'''
          if old not in text:
              raise SystemExit('setCameraMute success block not found')
          text = text.replace(old, new, 1)

          marker = '''    private fun saveConnectedPort() {
'''
          helper = '''    /** 성공한 셸 작업 뒤 현재 ADB 연결을 정리해 다음 작업이 새 무선 디버깅 세션으로 연결되게 한다. */
    private fun disconnectAfterSuccessfulCommand(operation: String) {
        try {
            disconnect()
            Log.i(TAG, "ADB session disconnected after $operation")
        } catch (e: Exception) {
            // CSC 명령 자체는 이미 완료됐으므로 연결 정리 실패가 작업 성공을 뒤집지는 않는다.
            logFailure("ADB disconnect after $operation failed", e)
        }
    }

'''
          if marker not in text:
              raise SystemExit('saveConnectedPort marker not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          Path('.github/workflows/apply-adb-session-cleanup.yml').unlink()
          PY

      - name: Commit ADB session cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/charmingcolor/shuttersoundzero/core/adb/StandaloneAdbManager.kt \
                  .github/workflows/apply-adb-session-cleanup.yml
          git commit -m 'fix: 카메라 설정 변경 후 ADB 세션 정리'
          git push origin HEAD:fix/first-run-shutter-sound-wording
