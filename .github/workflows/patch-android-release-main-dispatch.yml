name: Patch Android Release Main Dispatch

on:
  push:
    branches:
      - ci/release-main-dispatch
    paths:
      - '.github/workflows/patch-android-release-main-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/release-main-dispatch
          fetch-depth: 0

      - name: Patch Android Release workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-release.yml')
          text = path.read_text()

          old_dispatch = "  workflow_dispatch:\n"
          new_dispatch = """  workflow_dispatch:
            inputs:
              release_tag:
                description: 'Release tag to publish (leave empty for signed preflight)'
                required: false
                type: string
          """
          if old_dispatch not in text:
              raise SystemExit('workflow_dispatch marker not found')
          text = text.replace(old_dispatch, new_dispatch, 1)

          old_preflight = "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'"
          new_preflight = "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag == ''"
          if old_preflight not in text:
              raise SystemExit('preflight condition not found')
          text = text.replace(old_preflight, new_preflight, 1)

          token_expr = '${' + '{ github.token }}'
          dispatch_job = f"""
            dispatch-tag-release:
              name: Dispatch Tagged Release
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              runs-on: ubuntu-latest
              permissions:
                actions: write
                contents: read
              steps:
                - name: Dispatch release on main
                  shell: bash
                  env:
                    GH_TOKEN: {token_expr}
                  run: gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$GITHUB_REF_NAME"

          """
          marker = "  preflight:\n"
          if marker not in text:
              raise SystemExit('preflight job marker not found')
          text = text.replace(marker, dispatch_job + marker, 1)

          head, release = text.split("  release:\n", 1)

          old_release_if = "    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')"
          new_release_if = "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''"
          if old_release_if not in release:
              raise SystemExit('release condition not found')
          release = release.replace(old_release_if, new_release_if, 1)

          verify_marker = "      - name: Verify tag belongs to main\n"
          if verify_marker not in release:
              raise SystemExit('tag verification step marker not found')
          resolve_step = """      - name: Resolve release tag
                shell: bash
                run: |
                  RELEASE_TAG="$(jq -r '.inputs.release_tag // empty' "$GITHUB_EVENT_PATH")"
                  if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
                    echo "Invalid release tag: $RELEASE_TAG"
                    exit 1
                  fi
                  git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
                  RELEASE_SOURCE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
                  git checkout --detach "$RELEASE_SOURCE_SHA"
                  echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
                  echo "RELEASE_SOURCE_SHA=$RELEASE_SOURCE_SHA" >> "$GITHUB_ENV"

          """
          resolve_step = resolve_step.replace('              ', '      ', 1)
          resolve_step = resolve_step.replace('                ', '        ')
          release = release.replace(verify_marker, resolve_step + verify_marker, 1)

          old_ancestry = 'if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then'
          new_ancestry = 'if ! git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" "origin/main"; then'
          if old_ancestry not in release:
              raise SystemExit('ancestry check not found')
          release = release.replace(old_ancestry, new_ancestry, 1)

          replacements = {
              'TAG_VERSION="${GITHUB_REF_NAME#v}"': 'TAG_VERSION="${RELEASE_TAG#v}"',
              'bash .github/scripts/verify-release-signer.sh "$APK_PATH" "$ANDROID_HOME/build-tools/37.0.0/apksigner" "$GITHUB_REF_NAME"': 'bash .github/scripts/verify-release-signer.sh "$APK_PATH" "$ANDROID_HOME/build-tools/37.0.0/apksigner" "$RELEASE_TAG"',
              'RELEASE_APK="dist/ShutterSoundZero-${GITHUB_REF_NAME}.apk"': 'RELEASE_APK="dist/ShutterSoundZero-${RELEASE_TAG}.apk"',
              'gh release view "$GITHUB_REF_NAME"': 'gh release view "$RELEASE_TAG"',
              'gh release upload "$GITHUB_REF_NAME"': 'gh release upload "$RELEASE_TAG"',
              'gh release create "$GITHUB_REF_NAME"': 'gh release create "$RELEASE_TAG"',
              '--title "$GITHUB_REF_NAME"': '--title "$RELEASE_TAG"',
          }
          for old, new in replacements.items():
              if old not in release:
                  raise SystemExit(f'expected release token not found: {old}')
              release = release.replace(old, new)

          path.write_text(head + "  release:\n" + release)
          PY

          git rm .github/workflows/patch-android-release-main-dispatch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/android-release.yml
          git commit -m 'ci: run signed releases from main context'
          git push origin HEAD:ci/release-main-dispatch
