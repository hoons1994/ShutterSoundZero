name: Dependency Submission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > sdk-packages.txt
          if grep -q 'platforms;android-CinnamonBun' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37.0' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37.0'
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            PLATFORM_PACKAGE='platforms;android-37'
          else
            echo 'Android 17 SDK platform package was not found.'
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'build-tools;37.0.0'
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Verify official Gradle wrapper checksum
        run: bash .github/scripts/verify-gradle-wrapper.sh
      - name: Generate and upload resolved dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-upload
          additional-arguments: --no-configuration-cache --no-daemon
          cache-provider: basic
          artifact-retention-days: 7

